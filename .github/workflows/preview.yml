# Plan morning-digest § 3 and § 4: publish the digest preview to GitHub Pages.
# The HTML is built here and never committed (ADR 0003: no previews in the repo).
# The banner shows the repo variable LANE_MARKER; unset it and run again to take the marker off.
name: preview
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Write .env
        run: |
          cp .env.example .env
          sed -i "s/^LANE_MARKER=.*/LANE_MARKER=${LANE_MARKER}/" .env
        env:
          LANE_MARKER: ${{ vars.LANE_MARKER }}
      - run: scripts/save-preview.sh /digest/2026-10-28 _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
